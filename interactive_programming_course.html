        :root {

            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: #1e293b;
            --border-color: #334155;
            --accent: #10b981;
            --warning-bg: #451a03;
            --warning-text: #fde047;
            --code-bg: #000000;
            --code-text: #d4d4d4;
        }

        body[dir="ltr"] {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        * { box-sizing: border-box; }

        /* Header */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        .header-controls { display: flex; align-items: center; gap: 20px; }
        .search-container { position: relative; }
        .search-container input {
            padding: 8px 15px; border: 1px solid var(--border-color);
            border-radius: 20px; outline: none; width: 250px; font-family: inherit;
            background-color: var(--bg-color); color: var(--text-main);
        }
        .search-container input::placeholder { color: var(--text-muted); }
        .search-results {
            position: absolute; top: 100%; left: 0; right: 0;
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 8px; max-height: 300px; overflow-y: auto;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); display: none; z-index: 100;
        }
        .search-results.active { display: block; }
        .search-result-item { padding: 10px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .search-result-item:hover { background-color: var(--bg-color); }

        .lang-switch { display: flex; gap: 10px; background: var(--bg-color); padding: 5px; border-radius: 8px; }
        .lang-btn {
            background: transparent; border: none; padding: 5px 10px;
            cursor: pointer; border-radius: 5px; font-family: inherit;
            font-weight: 600; color: var(--text-muted); transition: 0.3s;
        }
        .lang-btn.active { background: var(--primary); color: white; }

        /* Layout */
        .layout { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar */
        .sidebar {
            width: 280px; background-color: var(--sidebar-bg);
            border-inline-end: 1px solid var(--border-color);
            display: flex; flex-direction: column; overflow-y: auto; transition: transform 0.3s ease;
        }
        .progress-container { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .progress-bar-bg { background-color: var(--border-color); border-radius: 10px; height: 10px; margin-top: 10px; overflow: hidden; }
        .progress-bar-fill { background-color: var(--accent); height: 100%; width: 0%; transition: width 0.5s ease; }
        
        .nav-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid var(--border-color); font-weight: 600; transition: background 0.2s; }
        .nav-item:hover { background-color: var(--bg-color); }
        .nav-item.active { background-color: var(--border-color); color: var(--primary); border-inline-start: 4px solid var(--primary); }
        .nav-subitem { padding: 10px 20px 10px 40px; font-size: 0.9rem; color: var(--text-muted); cursor: pointer; border-bottom: 1px solid var(--border-color); }
        body[dir="rtl"] .nav-subitem { padding: 10px 40px 10px 20px; }
        .nav-subitem:hover { color: var(--primary); }
        .nav-subitem.active { color: var(--primary); background-color: var(--bg-color); }

        /* Main Content */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; scroll-behavior: smooth; }
        .content-wrapper { max-width: 900px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); border: 1px solid var(--border-color); }

        h1 { font-size: 2rem; color: var(--primary); margin-bottom: 10px; }
        h2 { font-size: 1.5rem; color: var(--text-main); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 30px;}
        h3 { font-size: 1.25rem; color: var(--text-main); }
        p { line-height: 1.7; font-size: 1.05rem; }

        /* Term Cards */
        .terms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 15px; }
        .term-card { background: var(--bg-color); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); }
        .term-en { font-family: 'Roboto Mono', monospace; font-weight: 700; color: var(--primary); display: block; margin-bottom: 5px; }
        .term-ar { font-weight: 600; margin-bottom: 5px; display: block; }
        .term-desc { font-size: 0.9rem; color: var(--text-muted); margin: 0; }

        /* Important Note */
        .important-note { background-color: var(--warning-bg); border-inline-start: 5px solid var(--warning-text); padding: 20px; border-radius: 8px; margin: 25px 0; color: var(--warning-text); }
        .important-note h4 { margin-top: 0; margin-bottom: 10px; }

        /* Editable Code Editor */
        .code-container { margin: 20px 0; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid var(--border-color); }
        .code-header { background: #1e1e1e; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; color: #fff; border-bottom: 1px solid #333; }
        .code-title { font-family: 'Roboto Mono', monospace; font-size: 0.9rem; color: #a3a3a3; }
        .code-actions button { background: #333; color: white; border: 1px solid #444; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-inline-start: 10px; font-size: 0.85rem; transition: 0.2s; }
        .code-actions button:hover { background: #444; }
        .code-actions .run-btn { background: var(--primary); border-color: var(--primary); }
        .code-actions .run-btn:hover { background: var(--primary-hover); }
        
        textarea.code-editor { 
            width: 100%; min-height: 120px; background: var(--code-bg); color: var(--code-text); 
            padding: 20px; font-family: 'Roboto Mono', monospace; font-size: 1rem; 
            direction: ltr; text-align: left; border: none; resize: vertical; 
            outline: none; line-height: 1.5; display: block;
        }
        
        .code-output { background: #111; color: #fff; padding: 15px; font-family: 'Roboto Mono', monospace; min-height: 50px; direction: ltr; text-align: left; border-top: 1px solid #333; }
        .output-label { color: #888; font-size: 0.8rem; margin-bottom: 5px; display: block; }

        /* Line Explanations */
        .lbl-explanation-list { background: var(--bg-color); border-bottom: 1px solid var(--border-color); }

        /* Checklists */
        .checklist { list-style: none; padding: 0; }
        .checklist li { padding: 10px 0; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .checklist li:last-child { border-bottom: none; }
        .check-box { width: 24px; height: 24px; border: 2px solid var(--primary); border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: 0.2s; position: relative; }
        .checklist li.completed .check-box { background: var(--primary); }
        .checklist li.completed .check-box::after { content: ''; position: absolute; left: 6px; top: 2px; width: 6px; height: 12px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
        .checklist li.completed span { text-decoration: line-through; color: var(--text-muted); }

        /* Buttons */
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-color); }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.3s; font-family: inherit; }
        .btn:hover { background: var(--primary-hover); }

        /* Glossary Table */
        .glossary-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .glossary-table th, .glossary-table td { padding: 15px; border-bottom: 1px solid var(--border-color); text-align: start; }
        .glossary-table th { background: var(--bg-color); font-weight: 700; color: var(--primary); }
        .glossary-table tr:hover { background: var(--bg-color); }
        .glossary-en { font-family: 'Roboto Mono', monospace; font-weight: bold; }

        /* Quiz */
        .quiz-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .quiz-option { display: block; padding: 12px 15px; margin: 10px 0; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .quiz-option:hover { border-color: var(--primary); }
        .quiz-option.correct { background: rgba(16, 185, 129, 0.1); border-color: var(--accent); color: var(--accent); }
        .quiz-option.wrong { background: rgba(239, 68, 68, 0.1); border-color: #ef4444; color: #ef4444; }

        .mobile-menu-btn { display: none; background: none; border: none; font-size: 1.5rem; color: var(--primary); cursor: pointer; }

        /* Responsive */
        @media (max-width: 768px) {
            .mobile-menu-btn { display: block; }
            .sidebar {

                transform: translateX(-100%); z-index: 50; box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            }
            body[dir="rtl"] .sidebar { left: auto; right: 0; transform: translateX(100%); }
            .sidebar.active { transform: translateX(0); }
            .search-container input { width: 150px; }
            .header-controls { gap: 10px; }
            .main-content { padding: 20px; }
            .glossary-table { display: block; overflow-x: auto; }
        }
    
        .quiz-opt-btn:hover:not(:disabled) { border-color: var(--primary) !important; background: var(--bg-hover) !important; }
        .quiz-opt-btn:disabled { cursor: default; }

    </style>
</head>

        { term: "Logical Operator", ar: "عامل منطقي", enDesc: "Symbol used to connect conditions.", arDesc: "رمز يُستخدم للربط بين شرطين أو أكثر وتحديد النتيجة المنطقية." },
        { term: "Logical OR (||)", ar: "عامل 'أو' المنطقي", enDesc: "Operator returning true if at least one condition is met.", arDesc: "عامل يرجع true إذا تحقق شرط واحد على الأقل من الشروط المربوطة." },
        { term: "Logical AND (&&)", ar: "عامل 'و' المنطقي", enDesc: "Operator returning true only if all conditions are met.", arDesc: "عامل يرجع true فقط إذا تحققت جميع الشروط المربوطة معاً." },
        { term: "Line Break", ar: "كسر السطر", enDesc: "Writing code on multiple lines to organize it.", arDesc: "كتابة الأوامر البرمجية والأقواس على أسطر متعددة لتنظيم الكود." },
        { term: "for Loop", ar: "حلقة التكرار for", enDesc: "Programming structure to repeat execution.", arDesc: "بنية برمجية تُستخدم لتكرار تنفيذ مجموعة من الأوامر لعدد محدد من المرات." },
        { term: "Initialization", ar: "إعطاء القيمة المبدئية", enDesc: "First part of a for loop, setting the counter.", arDesc: "الجزء الأول من حلقة for المخصص للإعلان عن العداد وتحديد قيمته المبتدأة." },
        { term: "Increment Operator (++)", ar: "معامل الزيادة", enDesc: "Tool to automatically increase a variable by 1.", arDesc: "أداة برمجية متخصصة لزيادة قيمة المتغير بمقدار 1 تلقائياً." },
        { term: "Iteration", ar: "دورة تكرارية", enDesc: "One complete execution of commands inside a loop.", arDesc: "تنفيذ واحد مكتمل للأوامر الموجودة داخل حلقة التكرار." },
        { term: "Compound Condition", ar: "شرط مركب", enDesc: "Condition with multiple logical checks.", arDesc: "شرط يتكون من أكثر من فحص منطقي مربوط بـ && أو ||." },
        { term: "Indentation", ar: "المسافة البادئة", enDesc: "Empty space at line start to distinguish code blocks.", arDesc: "مساحة فارغة في بداية السطر لتمييز الأكواد التابعة لكتلة معينة." }
    ];

    function getStr(key) { return uiText[state.lang][key] || key; }

    function switchLang(l) {
        state.lang = l;
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.lang-btn[onclick="switchLang('${l}')"]`).classList.add('active');
        document.getElementById('searchInput').placeholder = getStr('searchPlaceholder');
        document.getElementById('progress-text-label').innerText = getStr('progress');
        renderSidebar();
        renderView();
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }

    function saveProgress() {
        localStorage.setItem('qureo_progress', JSON.stringify(progressData));
        updateProgressBar();
    }

    function updateProgressBar() {
        let totalSections = 0; courseData.forEach(ch => totalSections += ch.sections.length);
        let completed = progressData.completedSections.length;
        let percentage = totalSections === 0 ? 0 : Math.round((completed / totalSections) * 100);
        document.getElementById('progress-percentage').innerText = percentage + "%";
        document.getElementById('progress-fill').style.width = percentage + "%";
    }

    function markSectionCompleted(sectionId) {
        if (!progressData.completedSections.includes(sectionId)) {
            progressData.completedSections.push(sectionId);
            saveProgress(); renderSidebar();
        }
    }

    function toggleCheck(id) {
        progressData.checklists[id] = !progressData.checklists[id];
        saveProgress(); renderView(); 
    }

    function runUserCode(editorId, outputId) {
        const codeText = document.getElementById(editorId).value;
        const outputEl = document.getElementById(outputId);
        outputEl.innerHTML = '';
        let logs = [];
        const safeConsole = { log: function(...args) { logs.push(args.join(' ')); } };
        try {
            const func = new Function('console', codeText);
            func(safeConsole);
            if(logs.length === 0) { outputEl.innerHTML = `<span style="color:#888;">${getStr('noOutput')}</span>`; } 
            else { outputEl.innerHTML = logs.join('<br>'); }
        } catch(e) {
            outputEl.innerHTML = `<span style="color:#ef4444;">${e.name}: ${e.message}</span>`;
        }
    }

    function copyCode(editorId) { 
        const text = document.getElementById(editorId).value;
        navigator.clipboard.writeText(text); 
        alert('Copied!'); 
    }

    function renderSidebar() {
        let html = `<div class="nav-item ${state.currentPath === 'dashboard' ? 'active' : ''}" onclick="navigate('dashboard')">${getStr('dashboard')}</div>`;
        courseData.forEach(ch => {
            let chTitle = state.lang === 'ar' ? ch.titleAr : ch.titleEn;
            html += `<div class="nav-item" style="font-size:0.9rem; background:var(--bg-color); cursor:default; color:var(--text-muted);">${chTitle}</div>`;
            ch.sections.forEach(sec => {
                let secTitle = state.lang === 'ar' ? sec.titleAr : sec.titleEn;
                let isActive = state.currentPath === sec.id;
                html += `<div class="nav-subitem ${isActive ? 'active' : ''}" onclick="navigate('${sec.id}')">${secTitle}</div>`;
            });
            if (ch.quiz && ch.quiz.length > 0) { 
                let isActive = state.currentPath === 'quiz-' + ch.id; 
                html += `<div class="nav-subitem ${isActive ? 'active' : ''}" style="color:var(--primary); font-weight:bold;" onclick="startQuiz('${ch.id}')">${getStr('quiz')}</div>`; 
            }
        });
        html += `<div class="nav-item ${state.currentPath === 'glossary' ? 'active' : ''}" onclick="navigate('glossary')">${getStr('glossary')}</div>
                 <div class="nav-item ${state.currentPath === 'review' ? 'active' : ''}" onclick="navigate('review')">${getStr('quickReview')}</div>`;
        document.getElementById('nav-container').innerHTML = html;
    }

    function navigate(path) {
        state.currentPath = path; renderSidebar(); renderView();
        if(window.innerWidth <= 768) { document.getElementById('sidebar').classList.remove('active'); }
        document.getElementById('main-content').scrollTop = 0;
    }

    function renderView() {
        const mc = document.getElementById('main-content');
        if (state.currentPath === 'dashboard') { mc.innerHTML = renderDashboard(); }
        else if (state.currentPath === 'glossary') { mc.innerHTML = renderGlossaryPage(); }
        else if (state.currentPath === 'review') { mc.innerHTML = renderReviewPage(); }
        else if (state.currentPath.startsWith('quiz-')) { 
            let chId = state.currentPath.replace('quiz-', ''); 
            let chapter = courseData.find(c => c.id === chId); 
            mc.innerHTML = renderQuizPage(chapter); 
        }
        else {
            let section = null, chapter = null, flatSections = [];
            courseData.forEach(ch => { ch.sections.forEach(sec => { flatSections.push(sec); if (sec.id === state.currentPath) { section = sec; chapter = ch; } }); });
            if (section) {
                mc.innerHTML = renderSectionPage(chapter, section);
                markSectionCompleted(section.id);
                let idx = flatSections.findIndex(s => s.id === section.id);
                let navHtml = `<div class="nav-buttons">`;
                if (idx > 0) navHtml += `<button class="btn" onclick="navigate('${flatSections[idx-1].id}')">« ${getStr('prevLesson')}</button>`;
                else navHtml += `<div></div>`;
                
                let currentCh = courseData.find(c => c.sections.some(s => s.id === section.id));
                if (idx < flatSections.length - 1) {
                    let nextSec = flatSections[idx+1];
                    let nextCh = courseData.find(c => c.sections.some(s => s.id === nextSec.id));
                    if (currentCh.id !== nextCh.id && currentCh.quiz && currentCh.quiz.length > 0) {
                        navHtml += `<button class="btn" onclick="startQuiz('${currentCh.id}')">${getStr('quiz')} »</button>`;
                    } else {
                        navHtml += `<button class="btn" onclick="navigate('${nextSec.id}')">${getStr('nextLesson')} »</button>`;
                    }
                } else {
                    if (currentCh.quiz && currentCh.quiz.length > 0) {
                        navHtml += `<button class="btn" onclick="startQuiz('${currentCh.id}')">${getStr('quiz')} »</button>`;
                    } else {
                        navHtml += `<button class="btn" onclick="navigate('review')">${getStr('quickReview')} »</button>`;
                    }
                }
                navHtml += `</div>`;
                mc.innerHTML += navHtml;
            }
        }
    }

                    <p style="color: #e2e8f0;">${getStr('courseDesc')}</p>

                <div class="card">

        let l = state.lang;
        let html = `<div class="content-wrapper">`;
        html += `<h2 style="margin-top:0; color: var(--text-muted); font-size:1.1rem; border:none; padding:0;">${l==='ar'?chapter.titleAr:chapter.titleEn}</h2>`;
        html += `<h1 style="margin-top:5px;">${l==='ar'?sec.titleAr:sec.titleEn}</h1>`;
        
        if (sec.contentAr || sec.meaningAr) {
            html += `<div class="card">`;
            if (sec.contentAr) html += l === 'ar' ? sec.contentAr : sec.contentEn;
            else {
                html += `<p><strong>${getStr('meaning')}</strong> ${l==='ar'?sec.meaningAr:sec.meaningEn}</p>`;
                html += `<p><strong>${getStr('simplifiedExp')}</strong> ${l==='ar'?sec.simplifiedAr:sec.simplifiedEn}</p>`;
            }
            if (sec.pointsAr) {
                html += `<ul>`;
                (l==='ar'?sec.pointsAr:sec.pointsEn).forEach(p => html += `<li>${p}</li>`);
                html += `</ul>`;
            }
            html += `</div>`;
        }

        if (sec.notesAr) {
            (l==='ar'?sec.notesAr:sec.notesEn).forEach(n => {
                html += `<div class="important-note"><h4>${getStr('importantNote')}</h4><p style="margin:0">${n}</p></div>`;
            });
        }

        if (sec.terms) {
            html += `<div class="card"><h3>${getStr('techTerms')}</h3><div class="terms-grid">`;
            sec.terms.forEach(t => { html += `<div class="term-card"><span class="term-en">${t.term}</span><span class="term-desc">${l==='ar'?t.ar:t.en}</span></div>`; });
            html += `</div></div>`;
        }

        if (sec.codeExamples) {
            sec.codeExamples.forEach((c, idx) => {
                let outId = `out-${sec.id}-${idx}`;
                let editorId = `editor-${sec.id}-${idx}`;
                html += `<div class="code-container" id="code-${sec.id}-${idx}">
                    <div class="code-header"><span class="code-title">example.js</span>
                        <div class="code-actions">
                            <button onclick="copyCode('${editorId}')">${getStr('copyCode')}</button>
                            <button class="run-btn" onclick="runUserCode('${editorId}', '${outId}')">${getStr('runCode')}</button>
                        </div>
                    </div>`;
                
                html += `<textarea id="${editorId}" class="code-editor" spellcheck="false">${c.code}</textarea>`;
                
                if (c.lbl) {
                    html += `<div class="lbl-explanation-list">
                        <strong style="display:block; padding: 15px 20px 0 20px; color: var(--text-muted);">${getStr('lblClick')}</strong>
                        <ul style="padding: 0 40px 15px 40px; margin: 10px 0; color: var(--text-muted); font-size: 0.95rem;">`;
                    c.lbl.forEach(expl => {
                        html += `<li style="margin-bottom:8px;"><strong>Line ${expl.line + 1}:</strong> ${l === 'ar' ? expl.ar : expl.en}</li>`;
                    });
                    html += `</ul></div>`;
                }
                
                html += `<div class="code-output"><span class="output-label">${getStr('output')}</span><div id="${outId}">${c.output.replace(/\n/g, '<br>')}</div></div></div>`;
            });
        }

        if (sec.takeawaysAr) {
            html += `<div class="card"><h3>${getStr('keyTakeaways')}</h3><ul class="checklist">`;
            let tList = l === 'ar' ? sec.takeawaysAr : sec.takeawaysEn;
            tList.forEach((t, i) => {
                let checkId = `${sec.id}-check-${i}`;
                let isChecked = progressData.checklists[checkId];
                html += `<li class="${isChecked ? 'completed' : ''}" onclick="toggleCheck('${checkId}')">
                    <div class="check-box"></div><span>${t}</span>
                </li>`;
            });
            html += `</ul></div>`;
        }
        html += `</div>`; return html;
    }

        let html = `<div class="content-wrapper"><div class="card"><h1>${getStr('glossary')}</h1><div style="overflow-x:auto;"><table class="glossary-table">
            <thead><tr><th>${getStr('termHeader')}</th><th>${getStr('arMeaningHeader')}</th><th>${getStr('explanationHeader')}</th></tr></thead><tbody>`;

    function checkQuiz(element, isCorrect) {
        let parent = element.parentElement;
        parent.querySelectorAll('.quiz-option').forEach(el => { el.style.pointerEvents = 'none'; });
        if (isCorrect) {
            element.classList.add('correct'); element.innerHTML += ' - ' + getStr('correct');
        } else {
            element.classList.add('wrong'); element.innerHTML += ' - ' + getStr('wrong');
            parent.querySelectorAll('.quiz-option').forEach(el => {
                if(el.getAttribute('onclick').includes('true')) { el.classList.add('correct'); }
            });
        }
    }

    function handleSearch(query) {
        const resBox = document.getElementById('searchResults');
        if (!query.trim()) { resBox.classList.remove('active'); return; }
        let q = query.toLowerCase(), results = [];
        courseData.forEach(ch => {
            ch.sections.forEach(sec => {
                let tAr = sec.titleAr.toLowerCase(), tEn = sec.titleEn.toLowerCase();
                if (tAr.includes(q) || tEn.includes(q) || (sec.codeExamples && JSON.stringify(sec.codeExamples).toLowerCase().includes(q)) || (sec.terms && JSON.stringify(sec.terms).toLowerCase().includes(q))) {
                    results.push({ id: sec.id, title: state.lang === 'ar' ? sec.titleAr : sec.titleEn });
                }
            });
        });
        glossaryData.forEach(g => {
            if(g.term.toLowerCase().includes(q) || g.ar.toLowerCase().includes(q)) {
                if(!results.find(r => r.id === 'glossary')) results.push({ id: 'glossary', title: getStr('glossary') + ' - ' + g.term });
            }
        });
        if (results.length > 0) {
            resBox.innerHTML = results.map(r => `<div class="search-result-item" onclick="document.getElementById('searchInput').value=''; document.getElementById('searchResults').classList.remove('active'); navigate('${r.id}')">${r.title}</div>`).join('');
        } else {
            resBox.innerHTML = `<div style="padding:10px; color:#888;">${state.lang==='ar'?'لا توجد نتائج':'No results found'}</div>`;
        }
        resBox.classList.add('active');
    }

    // Init
    updateProgressBar(); renderSidebar(); renderView();
    document.addEventListener('click', (e) => { if (!e.target.closest('.search-container')) document.getElementById('searchResults').classList.remove('active'); });


    
    window.startQuiz = function(chId) {
        let chapter = courseData.find(c => c.id === chId);
        state.quizState = {
            chId: chId,
            answers: new Array(chapter.quiz.length).fill(null)
        };
        navigate('quiz-' + chId);
    };

    window.selectQuizOption = function(qIdx, optIdx) {
        let qState = state.quizState;
        if (!qState || qState.answers[qIdx] !== null) return;
        
        qState.answers[qIdx] = optIdx;
        
        // Find the element and update it directly to avoid re-rendering the whole page and losing scroll position
        let chapter = courseData.find(c => c.id === qState.chId);
        let q = chapter.quiz[qIdx];
        let l = state.lang;
        
        // Re-render only the specific question's card
        renderView(); // Actually, renderView() restores scroll to top in navigate, but here we just call renderApp().
        // Wait, renderView() is what we usually call. Let's just call renderApp() to stay in place, or renderView.
        // Actually navigate() sets scrollTop = 0. Just calling renderApp() will keep scroll!
        renderApp();
    };

    // We overwrite the existing renderQuizPage
    window.renderQuizPage = function(chapter) {
        let l = state.lang;
        let qState = state.quizState;
        if (!qState || qState.chId !== chapter.id) return `<div class="content-wrapper">Error</div>`;
        
        let html = `<div class="content-wrapper">`;
        html += `<div class="card" style="text-align:center; background:linear-gradient(135deg, var(--primary), var(--primary-hover)); color:white;">
                 <h1 style="margin:0; color:white;">${l==='ar'?'اختبار الفصل':'Chapter Quiz'}</h1>
                 <p style="margin:5px 0 0 0; color:#e2e8f0;">${l==='ar'?chapter.titleAr:chapter.titleEn}</p>
                 </div>`;
                 
        let correctCount = 0;
        let answeredCount = 0;
        let total = chapter.quiz.length;

        chapter.quiz.forEach((q, qIdx) => {
            let ans = qState.answers[qIdx];
            if (ans !== null) {
                answeredCount++;
                if (q.options[ans].isCorrect) correctCount++;
            }
            
            html += `<div class="card" style="margin-bottom:20px;" id="qcard-${qIdx}">`;
            html += `<div style="color:var(--text-muted); font-size:0.9rem; margin-bottom:10px;">${l==='ar'?'السؤال':'Question'} ${qIdx + 1} / ${total}</div>`;
            html += `<div style="font-size:1.1rem; font-weight:bold; margin-bottom:15px;">
                        <div style="margin-bottom:8px;">${q.qAr}</div>
                        <div style="color:var(--primary);">${q.qEn}</div>
                     </div>`;
            
            html += `<div style="display:flex; flex-direction:column; gap:10px;">`;
            q.options.forEach((opt, oIdx) => {
                let btnStyle = `padding:15px; border:2px solid var(--border-color); border-radius:8px; cursor:pointer; background:var(--bg-card); color:var(--text-color); font-size:1rem; transition:all 0.3s;`;
                if (l === 'ar') btnStyle += ` text-align:right;`;
                else btnStyle += ` text-align:left;`;
                
                if (ans !== null) {
                    if (opt.isCorrect) {
                        btnStyle += ` background:#10b98122; border-color:#10b981;`;
                    } else if (ans === oIdx) {
                        btnStyle += ` background:#ef444422; border-color:#ef4444;`;
                    }
                    html += `<button style="${btnStyle}" disabled>`;
                } else {
                    html += `<button style="${btnStyle}" class="quiz-opt-btn" onclick="selectQuizOption(${qIdx}, ${oIdx})">`;
                }
                html += `<div style="font-weight:bold; margin-bottom:4px;">${opt.textAr}</div>`;
                html += `<div style="color:var(--text-muted); font-size:0.9rem;">${opt.textEn}</div>`;
                html += `</button>`;
            });
            html += `</div>`;
            
            if (ans !== null) {
                let selectedIsCorrect = q.options[ans].isCorrect;
                html += `<div style="margin-top:20px; padding:20px; border-radius:8px; background:${selectedIsCorrect ? '#10b98122' : '#ef444422'}; border-left:5px solid ${selectedIsCorrect ? '#10b981' : '#ef4444'};">`;
                html += `<h3 style="margin-top:0; color:${selectedIsCorrect ? '#10b981' : '#ef4444'};">${selectedIsCorrect ? (l==='ar'?'إجابة صحيحة!':'Correct!') : (l==='ar'?'إجابة خاطئة!':'Incorrect!')}</h3>`;
                
                if (!selectedIsCorrect) {
                    html += `<p style="margin:5px 0;"><strong>${l==='ar'?'إجابتي / My Answer:':'My Answer / إجابتي:'}</strong><br> ${q.options[ans].textAr} <br><span style="color:var(--text-muted);">${q.options[ans].textEn}</span></p>`;
                    let correctOpt = q.options.find(o => o.isCorrect);
                    html += `<p style="margin:5px 0;"><strong>${l==='ar'?'الإجابة الصحيحة / Correct Answer:':'Correct Answer / الإجابة الصحيحة:'}</strong><br> ${correctOpt.textAr} <br><span style="color:var(--text-muted);">${correctOpt.textEn}</span></p>`;
                }
                
                html += `<div style="margin-top:15px; padding-top:15px; border-top:1px solid var(--border-color);">
                            <strong>${l==='ar'?'التصحيح / Correction:':'Correction / التصحيح:'}</strong>
                            <p style="margin:5px 0;">${q.explanationAr}</p>
                            <p style="margin:0; color:var(--text-muted);">${q.explanationEn}</p>
                         </div>`;
                html += `</div>`;
            }
            html += `</div>`; 
        });
        
        if (answeredCount === total) {
            let pct = Math.round((correctCount / total) * 100);
            let incorrectCount = total - correctCount;
            html += `<div class="card" style="text-align:center; margin-top:30px; border:2px solid var(--primary);">`;
            html += `<h2>${l==='ar'?'النتيجة النهائية':'Final Result'}</h2>`;
            html += `<div style="font-size:3.5rem; font-weight:bold; margin:20px 0; color:${pct >= 50 ? '#10b981' : '#ef4444'};">${pct}%</div>`;
            
            html += `<div style="display:flex; justify-content:center; gap:15px; margin-bottom:30px; flex-wrap:wrap;">
                        <div style="background:var(--bg-body); padding:15px; border-radius:8px; flex:1; min-width:120px;">
                            <div style="font-size:2rem; color:#10b981;">${correctCount}</div>
                            <div style="color:var(--text-muted); font-size:0.9rem; margin-top:5px;">${l==='ar'?'إجابة صحيحة<br>Correct':'Correct<br>إجابة صحيحة'}</div>
                        </div>
                        <div style="background:var(--bg-body); padding:15px; border-radius:8px; flex:1; min-width:120px;">
                            <div style="font-size:2rem; color:#ef4444;">${incorrectCount}</div>
                            <div style="color:var(--text-muted); font-size:0.9rem; margin-top:5px;">${l==='ar'?'إجابة خاطئة<br>Incorrect':'Incorrect<br>إجابة خاطئة'}</div>
                        </div>
                        <div style="background:var(--bg-body); padding:15px; border-radius:8px; flex:1; min-width:120px;">
                            <div style="font-size:2rem; color:var(--primary);">${correctCount} / ${total}</div>
                            <div style="color:var(--text-muted); font-size:0.9rem; margin-top:5px;">${l==='ar'?'الدرجة النهائية<br>Score':'Score<br>الدرجة النهائية'}</div>
                        </div>
                     </div>`;
                     
            html += `<button class="btn" style="margin:5px;" onclick="startQuiz('${chapter.id}')">${l==='ar'?'إعادة الاختبار / Retake Quiz':'Retake Quiz / إعادة الاختبار'}</button>`;
            
            let flatSections = [];
            courseData.forEach(ch => { ch.sections.forEach(sec => { flatSections.push({chId: ch.id, secId: sec.id}); }); });
            let lastSecIdOfCh = chapter.sections[chapter.sections.length - 1].id;
            let idx = flatSections.findIndex(s => s.secId === lastSecIdOfCh);
            
            if (idx !== -1 && idx < flatSections.length - 1) {
                let nextSec = flatSections[idx + 1].secId;
                html += ` <button class="btn" style="margin:5px; background:var(--bg-card); color:var(--text-color); border:1px solid var(--border-color);" onclick="navigate('${nextSec}')">${l==='ar'?'متابعة التعلم / Continue Learning':'Continue Learning / متابعة التعلم'} »</button>`;
            }
            
            html += `</div>`;
        }
        
        html += `</div>`;
        return html;
    }

</script>
</body>
</html>
